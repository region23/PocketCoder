services:
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: pocketcoder-daemon
    ports:
      - "8080:8080"
    environment:
      POCKETCODER_HOST: 0.0.0.0
      POCKETCODER_PORT: 8080
      POCKETCODER_API_KEY: ${POCKETCODER_API_KEY:-}
      POCKETCODER_CODEX_BIN: ${POCKETCODER_CODEX_BIN:-codex}
      POCKETCODER_CODEX_SAFE_ARGS: "${POCKETCODER_CODEX_SAFE_ARGS:-exec --mode safe}"
      POCKETCODER_CODEX_YOLO_ARGS: "${POCKETCODER_CODEX_YOLO_ARGS:-exec --mode yolo}"
      POCKETCODER_CLOUDCODE_BIN: ${POCKETCODER_CLOUDCODE_BIN:-cloudcode}
      POCKETCODER_CLOUDCODE_SAFE_ARGS: "${POCKETCODER_CLOUDCODE_SAFE_ARGS:-exec --mode safe}"
      POCKETCODER_CLOUDCODE_YOLO_ARGS: "${POCKETCODER_CLOUDCODE_YOLO_ARGS:-exec --mode yolo}"
      POCKETCODER_OPENCODE_BIN: ${POCKETCODER_OPENCODE_BIN:-opencode}
      POCKETCODER_OPENCODE_SAFE_ARGS: "${POCKETCODER_OPENCODE_SAFE_ARGS:-exec --mode safe}"
      POCKETCODER_OPENCODE_YOLO_ARGS: "${POCKETCODER_OPENCODE_YOLO_ARGS:-exec --mode yolo}"
      POCKETCODER_CLI_AUTO_INSTALL: ${POCKETCODER_CLI_AUTO_INSTALL:-0}
      POCKETCODER_CLI_AUTO_UPDATE_INTERVAL_SECONDS: ${POCKETCODER_CLI_AUTO_UPDATE_INTERVAL_SECONDS:-0}
      POCKETCODER_MIN_FREE_DISK_MB: ${POCKETCODER_MIN_FREE_DISK_MB:-100}
      POCKETCODER_LOG_MAX_BYTES: ${POCKETCODER_LOG_MAX_BYTES:-5242880}
      POCKETCODER_LOG_BACKUP_COUNT: ${POCKETCODER_LOG_BACKUP_COUNT:-3}
      POCKETCODER_CODEX_INSTALL_CMD: ${POCKETCODER_CODEX_INSTALL_CMD:-}
      POCKETCODER_CODEX_UPDATE_CMD: ${POCKETCODER_CODEX_UPDATE_CMD:-}
      POCKETCODER_CLOUDCODE_INSTALL_CMD: ${POCKETCODER_CLOUDCODE_INSTALL_CMD:-}
      POCKETCODER_CLOUDCODE_UPDATE_CMD: ${POCKETCODER_CLOUDCODE_UPDATE_CMD:-}
      POCKETCODER_OPENCODE_INSTALL_CMD: ${POCKETCODER_OPENCODE_INSTALL_CMD:-}
      POCKETCODER_OPENCODE_UPDATE_CMD: ${POCKETCODER_OPENCODE_UPDATE_CMD:-}
    volumes:
      - ./runtime/data:/app/data
      - ./runtime/logs:/app/logs
      - ./runtime/projects:/app/projects
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: pocketcoder-bot
    environment:
      POCKETCODER_DAEMON_URL: http://daemon:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      POCKETCODER_API_KEY: ${POCKETCODER_API_KEY:-}
      POCKETCODER_ALLOWED_USER_IDS: ${POCKETCODER_ALLOWED_USER_IDS:-}
      POCKETCODER_ALLOWED_CHAT_IDS: ${POCKETCODER_ALLOWED_CHAT_IDS:-}
    depends_on:
      - daemon
    restart: unless-stopped
