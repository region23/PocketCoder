[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketcoder"
version = "0.1.0"
description = "PocketCoder daemon and bot MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-telegram-bot>=21.0",
  "apscheduler>=3.10.4",
]

[project.scripts]
pocketcoder-daemon = "pocketcoder_daemon.main:run"
pocketcoder-bot = "pocketcoder_bot.main:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["pocketcoder_daemon", "pocketcoder_daemon.adapters", "pocketcoder_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
